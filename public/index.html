<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f6fc8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2a1f3d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" href="/icons/icon-192.png">
<title>My Singing Shapes</title>
<style>
:root{
  --plum:#2b1a3a; --plum2:#3a2550; --plum3:#4a3166; --deep:#22142e; --wood:#8a5428; --woodL:#b0703a; --woodD:#2e1606; --cream:#f4e9d4; --leaf:#5cb82a; --leafD:#1c4208;
  --navy:#2e1606; --ink:#2e1606; --dk:#2e1606;
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --ol: 0 2px 0 #1a0c04, 2px 0 0 #1a0c04, -2px 0 0 #1a0c04, 0 -2px 0 #1a0c04, 1.5px 1.5px 0 #1a0c04, -1.5px 1.5px 0 #1a0c04, 1.5px -1.5px 0 #1a0c04, -1.5px -1.5px 0 #1a0c04;
  --frame: 0 0 0 3px var(--woodD), inset 0 0 0 3px var(--woodD);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;background:#22142e;font-family:var(--font);color:var(--cream);user-select:none;-webkit-user-select:none;touch-action:none;}
#root{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden;--u:1;}
canvas#game{position:absolute;inset:0;display:block;touch-action:none;}
button{font-family:var(--font);cursor:pointer;color:var(--cream);}
.hidden{display:none !important;}
.center{text-align:center;}
.sc{font-variant:small-caps;letter-spacing:.5px;}

/* ===== HUD ===== */
#hud{position:absolute;inset:0;pointer-events:none;z-index:5;}
#hud > *{pointer-events:auto;}
#tl{position:absolute;left:calc(10px*var(--u));top:calc(8px*var(--u));display:flex;flex-direction:column;align-items:flex-start;gap:calc(14px*var(--u));pointer-events:none;}
#tl > *{pointer-events:auto;}
.lvlbox{display:flex;align-items:center;cursor:pointer;}
.lvlbox .star{position:relative;width:calc(44px*var(--u));height:calc(44px*var(--u));z-index:2;flex:none;}
.lvlbox .star > span{position:absolute;inset:0;display:grid;place-items:center;}
.lvlbox .star svg{width:100%;height:100%;}
#lvl{display:none;}
.xpwrap{position:relative;margin-left:calc(-14px*var(--u));width:calc(200px*var(--u));height:calc(30px*var(--u));background:var(--plum2);border:3px solid var(--wood);box-shadow:var(--frame);border-radius:0 12px 12px 0;padding:calc(4px*var(--u)) calc(6px*var(--u)) calc(4px*var(--u)) calc(16px*var(--u));}
.xpbar{width:100%;height:100%;border-radius:6px;background:var(--deep);overflow:hidden;}
.xpbar i{display:block;height:100%;width:0;background:#6cc83a;transition:width .3s;}
.xptxt{position:absolute;inset:0;padding-left:calc(10px*var(--u));display:grid;place-items:center;font-size:calc(15px*var(--u));color:#fff;font-weight:900;text-shadow:var(--ol);font-variant:small-caps;letter-spacing:.5px;}
#goal{max-width:calc(280px*var(--u));background:var(--plum2);border:3px solid var(--wood);box-shadow:var(--frame);border-radius:12px;padding:calc(7px*var(--u)) calc(11px*var(--u));font-weight:800;font-size:calc(13px*var(--u));color:var(--cream);line-height:1.3;}
#tc{position:absolute;left:50%;top:calc(8px*var(--u));transform:translateX(-50%);pointer-events:none;}
#isle-name{padding:calc(3px*var(--u)) calc(20px*var(--u));font-size:calc(18px*var(--u));color:#fff;text-shadow:var(--ol);font-weight:900;background:#5a2e7a;border:3px solid var(--wood);box-shadow:var(--frame);border-radius:6px;white-space:nowrap;font-variant:small-caps;letter-spacing:.5px;}
#tr{position:absolute;right:calc(10px*var(--u));top:calc(8px*var(--u));display:flex;gap:calc(10px*var(--u));align-items:center;}
.cur{position:relative;display:flex;align-items:center;height:calc(32px*var(--u));background:var(--plum2);border:3px solid var(--wood);box-shadow:var(--frame);border-radius:16px;padding:0 calc(34px*var(--u)) 0 calc(30px*var(--u));min-width:calc(118px*var(--u));margin-left:calc(12px*var(--u));}
.cur .ci{position:absolute;left:calc(-13px*var(--u));top:50%;transform:translateY(-50%);width:calc(38px*var(--u));height:calc(38px*var(--u));}
.cur .ci svg{width:100%;height:100%;}
.cur .cv{flex:1;text-align:center;color:#fff;font-weight:900;font-size:calc(16px*var(--u));text-shadow:var(--ol);}
.cur .plus{position:absolute;right:calc(-2px*var(--u));top:50%;transform:translateY(-50%);width:calc(28px*var(--u));height:calc(28px*var(--u));border-radius:50%;border:2px solid var(--leafD);background:var(--leaf);color:#fff;font-size:calc(20px*var(--u));font-weight:900;line-height:1;padding:0;text-shadow:var(--ol);}
.cur .plus .dot{top:-10px;right:-10px;}

/* square wood buttons */
.sbtn{position:relative;width:var(--sb,calc(56px*var(--u)));height:var(--sb,calc(56px*var(--u)));border-radius:14px;border:3px solid var(--wood);box-shadow:0 0 0 2px var(--woodD),inset 0 0 0 2px var(--woodD),0 5px 0 var(--woodD);background:var(--sbg,#4a3166);padding:0;display:grid;place-items:center;transition:transform .08s;}
.sbtn:active{transform:translateY(3px);}
.sbtn > span:first-child{width:68%;height:68%;display:block;}
.sbtn > span:first-child svg{width:100%;height:100%;}
.slbl,.rlbl{position:absolute;left:50%;bottom:calc(-19px*var(--u));transform:translateX(-50%);font-size:calc(12.5px*var(--u));color:#fff;text-shadow:var(--ol);font-weight:900;white-space:nowrap;font-variant:small-caps;letter-spacing:.5px;}
#br{position:absolute;right:calc(12px*var(--u));bottom:calc(26px*var(--u));display:flex;gap:calc(10px*var(--u));align-items:flex-end;}
#b-goals{--sb:calc(48px*var(--u));--sbg:#e8d6a8;}
#b-muteall{--sb:calc(48px*var(--u));--sbg:#a8d8f0;margin-top:calc(24px*var(--u));}
#b-muteall.on{--sbg:#b8b0c0;}
.rbtn{position:relative;width:var(--rb,calc(54px*var(--u)));height:var(--rb,calc(54px*var(--u)));border-radius:50%;border:3px solid var(--wood);box-shadow:0 0 0 2px var(--woodD),0 4px 0 var(--woodD);padding:0;display:grid;place-items:center;background:var(--c,#3a8ad8);transition:transform .08s;}
.rbtn:active{transform:translateY(3px);}
.rbtn > span:first-child{width:60%;height:60%;display:block;} .rbtn > span:first-child svg{width:100%;height:100%;}
.dot{position:absolute;top:-7px;right:-7px;min-width:calc(22px*var(--u));height:calc(22px*var(--u));border-radius:11px;background:#e23a4a;color:#fff;border:2px solid var(--woodD);font-size:calc(12px*var(--u));display:grid;place-items:center;padding:0 4px;font-weight:900;z-index:3;}
.c-blue{--c:#3a8ad8;} .c-green{--c:#5cb82a;} .c-pink{--c:#e0508a;} .c-yellow{--c:#f2b21e;} .c-purple{--c:#8a5ad8;} .c-orange{--c:#f07a2a;} .c-red{--c:#d8323e;} .c-gray{--c:#8a7a9a;} .c-teal{--c:#22a898;} .c-cream{--c:#e8d6a8;}

/* ===== BUTTONS ===== */
.btn{--b:var(--leaf);--bd:var(--leafD);border:3px solid var(--bd);border-radius:10px;padding:calc(7px*var(--u)) calc(16px*var(--u));font-weight:900;font-size:calc(15px*var(--u));color:#fff;text-shadow:var(--ol);background:var(--b);box-shadow:0 4px 0 var(--bd);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .08s;white-space:nowrap;font-variant:small-caps;letter-spacing:.5px;}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bd);}
.btn.green{--b:var(--leaf);--bd:var(--leafD);} .btn.blue{--b:#3a7ad0;--bd:#142e5a;} .btn.pink{--b:#d8508a;--bd:#5a1430;} .btn.gray{--b:#6a5a7a;--bd:#2a1a3a;} .btn.red{--b:#d8323e;--bd:#5a0a14;} .btn.purple{--b:#8a5ad8;--bd:#2e1460;} .btn.wood{--b:var(--wood);--bd:var(--woodD);}
.btn[disabled]{filter:grayscale(.9) brightness(.8);cursor:not-allowed;}
.btn.sm{padding:calc(4px*var(--u)) calc(10px*var(--u));font-size:calc(13.5px*var(--u));border-radius:9px;box-shadow:0 3px 0 var(--bd);}
.btn .ico{width:1.15em;height:1.15em;}
.sqbtn{position:relative;width:calc(64px*var(--u));height:calc(64px*var(--u));border-radius:12px;border:3px solid #6a6a6a;background:#a8a8a8;box-shadow:0 0 0 2px #2a2a2a,0 4px 0 #2a2a2a;padding:6px;}
.sqbtn svg{width:100%;height:100%;}
.sqbtn .cost{position:absolute;top:-12px;left:50%;transform:translateX(-50%);color:#fff;font-weight:900;text-shadow:var(--ol);font-size:calc(15px*var(--u));}

/* ===== PANELS ===== */
#modal-wrap{position:absolute;inset:0;background:rgba(14,6,22,.6);z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(10px*var(--u));}
.panel{position:relative;background:var(--plum2);border:5px solid var(--wood);box-shadow:0 0 0 3px var(--woodD),inset 0 0 0 3px var(--woodD),0 10px 30px rgba(0,0,0,.5);border-radius:22px;width:min(980px,100%);max-height:calc(var(--vh) - 20px*var(--u));display:flex;flex-direction:column;animation:panelIn .2s cubic-bezier(.2,1.3,.5,1);padding:0 calc(12px*var(--u)) calc(12px*var(--u));}
.panel.wide{width:min(980px,100%);}
@keyframes panelIn{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.vine{position:absolute;width:calc(150px*var(--u));height:calc(75px*var(--u));background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 60'><path d='M4 8 C30 4 40 30 64 20 S96 4 116 14' fill='none' stroke='%232e4a1c' stroke-width='6' stroke-linecap='round'/><path d='M4 8 C30 4 40 30 64 20 S96 4 116 14' fill='none' stroke='%235a8a32' stroke-width='3' stroke-linecap='round'/><path d='M40 22 c-2 10 6 16 12 14' fill='none' stroke='%235a8a32' stroke-width='3' stroke-linecap='round'/><ellipse cx='22' cy='14' rx='8' ry='4' fill='%236a9a3a' stroke='%232e4a1c' stroke-width='2' transform='rotate(30 22 14)'/><ellipse cx='78' cy='12' rx='8' ry='4' fill='%236a9a3a' stroke='%232e4a1c' stroke-width='2' transform='rotate(-20 78 12)'/><ellipse cx='100' cy='22' rx='7' ry='3.5' fill='%234f7a2e' stroke='%232e4a1c' stroke-width='2' transform='rotate(40 100 22)'/><circle cx='52' cy='36' r='3' fill='%235a8a32'/></svg>") no-repeat center/contain;pointer-events:none;z-index:2;}
.vine.v1{left:calc(-18px*var(--u));top:calc(-24px*var(--u));}
.vine.v2{right:calc(-18px*var(--u));top:calc(-24px*var(--u));background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 60'><g transform='translate(120 0) scale(-1 1)'><path d='M4 8 C30 4 40 30 64 20 S96 4 116 14' fill='none' stroke='%232e4a1c' stroke-width='6' stroke-linecap='round'/><path d='M4 8 C30 4 40 30 64 20 S96 4 116 14' fill='none' stroke='%235a8a32' stroke-width='3' stroke-linecap='round'/><path d='M40 22 c-2 10 6 16 12 14' fill='none' stroke='%235a8a32' stroke-width='3' stroke-linecap='round'/><ellipse cx='22' cy='14' rx='8' ry='4' fill='%236a9a3a' stroke='%232e4a1c' stroke-width='2' transform='rotate(30 22 14)'/><ellipse cx='78' cy='12' rx='8' ry='4' fill='%236a9a3a' stroke='%232e4a1c' stroke-width='2' transform='rotate(-20 78 12)'/><ellipse cx='100' cy='22' rx='7' ry='3.5' fill='%234f7a2e' stroke='%232e4a1c' stroke-width='2' transform='rotate(40 100 22)'/><circle cx='52' cy='36' r='3' fill='%235a8a32'/></g></svg>");}
.panel-head{position:relative;display:flex;align-items:center;justify-content:center;padding:calc(10px*var(--u)) 56px calc(10px*var(--u));}
.plaque{display:flex;align-items:center;gap:8px;background:var(--deep);border:4px solid var(--wood);box-shadow:0 0 0 2px var(--woodD),inset 0 0 0 2px var(--woodD);border-radius:14px;padding:calc(4px*var(--u)) calc(30px*var(--u));}
.plaque h2{margin:0;font-size:calc(24px*var(--u));font-weight:900;color:#a8f04a;text-shadow:var(--ol);font-variant:small-caps;letter-spacing:2px;}
.plaque > svg{width:calc(30px*var(--u));height:calc(30px*var(--u));flex:none;}
.xbtn{position:absolute;right:calc(-16px*var(--u));top:calc(-16px*var(--u));width:calc(48px*var(--u));height:calc(48px*var(--u));border-radius:12px;border:3px solid #6a6a6a;background:#a8a8a8;box-shadow:0 0 0 2px #2a2a2a,0 4px 0 #2a2a2a;color:#d8323e;font-size:calc(30px*var(--u));font-weight:900;text-shadow:0 2px 0 #5a0a14,2px 0 0 #5a0a14,-2px 0 0 #5a0a14,0 -2px 0 #5a0a14;display:grid;place-items:center;padding:0;z-index:3;}
.xbtn:active{transform:translateY(2px);}
.panel-body{background:var(--deep);border:3px solid var(--woodD);border-radius:14px;padding:calc(14px*var(--u));overflow:auto;overscroll-behavior:contain;touch-action:pan-y;flex:1;min-height:0;}
.rot .panel-body{touch-action:none;}
.backrow{padding:0 0 calc(8px*var(--u));}
.muted{color:#c8b6dc;font-size:calc(13px*var(--u));font-weight:700;}
.muted b{color:#fff;}
.info{background:var(--plum2);border:2px solid #5a3a72;border-radius:12px;padding:12px;}
.sec{font-weight:900;font-size:calc(17px*var(--u));margin:14px 0 8px;display:flex;align-items:center;gap:8px;color:#a8f04a;font-variant:small-caps;letter-spacing:1px;}
.sec:first-child{margin-top:0;}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:calc(14px*var(--u));margin:6px 0;font-weight:700;}
.kv b{font-weight:900;color:#a8f04a;font-variant:small-caps;}
.bar{height:14px;border-radius:7px;background:#150a1e;border:2px solid var(--woodD);overflow:hidden;}
.bar i{display:block;height:100%;background:#6cc83a;}
.timer{font-weight:900;margin:6px 0;font-size:calc(17px*var(--u));color:#fff;text-shadow:var(--ol);}
.big-name{font-weight:900;font-size:calc(20px*var(--u));color:#fff;text-shadow:var(--ol);font-variant:small-caps;}
input[type=range]{width:100%;accent-color:var(--leaf);height:28px;}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.tier{font-size:10px;font-weight:900;color:#fff;border-radius:6px;padding:2px 8px;text-transform:uppercase;letter-spacing:.5px;}
.els{display:flex;gap:2px;justify-content:center;}
.el{width:22px;height:22px;border-radius:50%;border:2px solid var(--woodD);display:grid;place-items:center;font-size:11px;}

/* market categories */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(16px*var(--u));padding:calc(6px*var(--u));}
.cat{position:relative;aspect-ratio:1.05;border-radius:16px;border:5px solid var(--wood);box-shadow:0 0 0 3px var(--woodD),inset 0 0 0 3px var(--woodD),0 5px 0 var(--woodD);background:var(--deep);padding:calc(10px*var(--u)) calc(8px*var(--u)) calc(34px*var(--u));overflow:hidden;}
.cat canvas{display:block;}
.cat:active{transform:translateY(3px);}
.catname{position:absolute;left:0;right:0;bottom:calc(8px*var(--u));text-align:center;font-weight:900;font-size:calc(18px*var(--u));color:#fff;text-shadow:var(--ol);font-variant:small-caps;letter-spacing:1px;}
/* wooden cards */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(170px*var(--u)),1fr));gap:calc(18px*var(--u)) calc(14px*var(--u));padding:4px 4px 18px;}
.small .wgrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));}
.wgrid.hrow{display:grid;grid-auto-flow:column;grid-template-columns:none;grid-template-rows:auto;grid-auto-columns:calc(170px*var(--u));overflow-x:auto;overflow-y:hidden;overscroll-behavior:contain;touch-action:pan-x;padding:4px 4px calc(28px*var(--u));scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:var(--wood) transparent;}
.wgrid.hrow>.wcard{scroll-snap-align:start;}
.small .wgrid.hrow{grid-auto-columns:150px;grid-template-columns:none;}
.rot .wgrid.hrow{touch-action:none;}
.wgrid.hrow::-webkit-scrollbar{height:10px;}.wgrid.hrow::-webkit-scrollbar-thumb{background:var(--wood);border-radius:6px;}
.wgrid.small-cards{grid-template-columns:repeat(auto-fill,minmax(calc(120px*var(--u)),1fr));}
.wcard{position:relative;background:var(--deep);border:4px solid var(--wood);box-shadow:0 0 0 2px var(--woodD),inset 0 0 0 2px var(--woodD);border-radius:14px;display:flex;flex-direction:column;align-items:center;padding-bottom:calc(22px*var(--u));text-align:center;}
.wcard.pick{cursor:pointer;padding-bottom:8px;}
.wcard.sel{border-color:#a8f04a;}
.wname{align-self:stretch;background:var(--plum2);border-bottom:3px solid var(--wood);border-radius:9px 9px 0 0;padding:calc(6px*var(--u)) 6px;font-weight:900;font-size:calc(16px*var(--u));color:#fff;text-shadow:var(--ol);font-variant:small-caps;letter-spacing:.5px;}
.wprice{align-self:stretch;display:flex;justify-content:space-between;align-items:center;padding:4px 10px 0;font-weight:900;color:#ffd84a;text-shadow:var(--ol);font-size:calc(15px*var(--u));}
.wprice span:last-child{color:#fff;}
.wart{position:relative;width:100%;display:grid;place-items:center;min-height:calc(118px*var(--u));background:radial-gradient(ellipse at 50% 75%,rgba(255,255,255,.12),transparent 65%);}
.wart svg{width:100%;height:100%;}
.wcard.locked .wart canvas{opacity:.45;}
.req{position:absolute;left:0;right:0;bottom:4px;font-weight:900;color:#fff;text-shadow:var(--ol);font-size:calc(14px*var(--u));font-variant:small-caps;line-height:1.1;}
.req b{display:block;font-size:calc(22px*var(--u));}
.wbuy{margin:2px 0 4px;}
.medals{position:absolute;left:50%;bottom:calc(-18px*var(--u));transform:translateX(-50%);display:flex;gap:2px;}
.medal{width:calc(34px*var(--u));height:calc(34px*var(--u));border-radius:50%;border:3px solid var(--wood);box-shadow:0 0 0 2px var(--woodD);display:grid;place-items:center;font-size:calc(15px*var(--u));}
.newb{position:absolute;right:calc(-14px*var(--u));top:calc(60px*var(--u));width:calc(46px*var(--u));height:calc(46px*var(--u));border-radius:50%;background:var(--deep);border:3px solid var(--wood);box-shadow:0 0 0 2px var(--woodD);display:grid;place-items:center;color:#a8f04a;font-weight:900;font-size:calc(13px*var(--u));transform:rotate(-15deg);text-shadow:var(--ol);z-index:2;}
/* slots */
.slot{width:150px;min-height:170px;border:3px dashed #6a4a82;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:rgba(255,255,255,.03);font-weight:900;padding:8px;}
.slot.filled{border:4px solid var(--wood);box-shadow:0 0 0 2px var(--woodD),inset 0 0 0 2px var(--woodD);background:var(--plum2);}
.slot b{font-size:15px;color:#fff;text-shadow:var(--ol);font-variant:small-caps;}
.egg-slot{width:calc(170px*var(--u));min-height:calc(200px*var(--u));}
.small .slot{width:130px;min-height:150px;}
.breedrow{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;}
.plus{font-size:40px;font-weight:900;color:#ff7ab0;text-shadow:var(--ol);}
.mini{display:flex;align-items:center;gap:8px;background:var(--plum2);border:3px solid var(--wood);border-radius:12px;padding:4px 10px 4px 4px;}
.stage{background:radial-gradient(ellipse at 50% 70%,#4a3166,#22142e 70%);border:4px solid var(--wood);box-shadow:0 0 0 2px var(--woodD);border-radius:14px;display:grid;place-items:center;}
.sfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:calc(16px*var(--u));padding:10px 12px;background:var(--plum2);border:3px solid var(--wood);border-radius:12px;}
.list{display:flex;flex-direction:column;gap:8px;}
.mixrow{display:flex;align-items:center;gap:10px;background:var(--plum2);border:3px solid var(--wood);border-radius:12px;padding:4px 10px 4px 4px;}
.mixrow.resting{opacity:.55;}.mixrow.resting::after{content:'resting';font-size:11px;font-weight:900;color:#c8b6dc;}
.mixrow .meter{flex:1;height:10px;border-radius:5px;background:#150a1e;overflow:hidden;}
.mixrow .meter i{display:block;height:100%;width:0;background:#6cc83a;}

/* ===== MAP ===== */
#map{position:absolute;inset:0;z-index:15;background:#ead2a0 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='200' viewBox='0 0 260 200'><g fill='none' stroke='%23a07848' stroke-width='3' stroke-linecap='round' opacity='.55'><path d='M40 120 c-20 0 -24 -30 -6 -36 c-4 -20 24 -28 32 -12 c16 -6 28 14 16 26 c10 12 -6 26 -18 20 c-6 6 -18 6 -24 2z'/><path d='M52 118 v22'/><path d='M190 70 l-16 46 h32 z'/><path d='M190 116 v14'/><path d='M150 160 c-12 0 -14 -18 -2 -22 c0 -14 18 -16 22 -4 c12 0 14 18 2 22z'/><path d='M158 160 v14'/></g></svg>") repeat;display:flex;}
#map-list{width:40%;max-width:420px;display:flex;flex-direction:column;gap:calc(6px*var(--u));padding:calc(10px*var(--u)) 0 calc(10px*var(--u));overflow:auto;}

.mrow{position:relative;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;min-height:calc(62px*var(--u));padding:4px calc(20px*var(--u));border:4px solid var(--wood);border-left:none;border-radius:0 14px 14px 0;box-shadow:0 0 0 2px var(--woodD),0 4px 0 var(--woodD);background:linear-gradient(90deg,var(--mc) 0 45%,#2b1a3a 100%);text-align:right;}

.mplaque{background:#5a2e7a;border:4px solid var(--wood);box-shadow:0 0 0 2px var(--woodD);border-radius:6px;padding:calc(4px*var(--u)) calc(26px*var(--u));font-weight:900;font-size:calc(26px*var(--u));color:#fff;text-shadow:var(--ol);font-variant:small-caps;letter-spacing:1px;}
.mtext{font-weight:900;color:#3a2410;font-size:calc(16px*var(--u));}

/* ===== MONSTER BAR ===== */
#sheet{position:absolute;left:calc(16px*var(--u));right:calc(16px*var(--u));bottom:calc(14px*var(--u));z-index:8;display:flex;justify-content:space-between;align-items:flex-end;gap:calc(14px*var(--u));pointer-events:none;animation:sheetIn .2s ease-out;}

.sh-card{position:relative;background:var(--plum2);border:4px solid var(--wood);box-shadow:0 0 0 3px var(--woodD),inset 0 0 0 2px var(--woodD),0 6px 0 var(--woodD);border-radius:18px;padding:calc(18px*var(--u)) calc(14px*var(--u)) calc(12px*var(--u));display:flex;align-items:center;gap:calc(10px*var(--u));}

.sh-card .xbtn{width:calc(36px*var(--u));height:calc(36px*var(--u));font-size:calc(22px*var(--u));right:calc(-14px*var(--u));top:calc(-14px*var(--u));}

.toast{background:var(--plum2);color:#fff;font-weight:900;border-radius:10px;padding:6px 16px;font-size:calc(14px*var(--u));border:3px solid var(--wood);box-shadow:0 0 0 2px var(--woodD);text-shadow:var(--ol);animation:toastIn .2s ease-out, toastOut .35s ease-in forwards 2.2s;white-space:nowrap;}
.toast.good{background:#2f7a1a;} .toast.bad{background:#8a1a2a;}

.burst{text-align:center;background:var(--plum2);border:5px solid var(--wood);box-shadow:0 0 0 3px var(--woodD),inset 0 0 0 3px var(--woodD);border-radius:22px;padding:calc(16px*var(--u)) calc(24px*var(--u));animation:panelIn .3s cubic-bezier(.2,1.5,.5,1);position:relative;max-width:92%;max-height:calc(var(--vh) - 20px);overflow:auto;color:#fff;}

.rays{display:none;}
.small .burst .stage{transform:scale(.8);margin:-12px auto !important;}
.tiny .burst .stage{transform:scale(.6);margin:-34px auto !important;}

.tiny .burst h1{font-size:24px;}

/* ===== BOOK ===== */
#book{position:absolute;inset:0;z-index:15;}

#bk-exit{position:absolute;right:calc(30px*var(--u));bottom:calc(36px*var(--u));--sbg:#a8a8a8;}

#bk-prev{left:calc(6px*var(--u));} #bk-next{right:calc(6px*var(--u));}
#bk-prev:active,#bk-next:active{transform:translateY(-45%);}
#bk-list{position:absolute;left:calc(30px*var(--u));bottom:calc(110px*var(--u));display:flex;flex-direction:column;gap:8px;background:var(--deep);border:3px solid var(--wood);border-radius:14px;padding:10px;}

#visitbar{position:absolute;left:0;right:0;bottom:calc(14px*var(--u));z-index:6;display:flex;justify-content:space-between;align-items:flex-end;padding:0 calc(14px*var(--u));gap:10px;pointer-events:none;}

.tut-ring{position:absolute;left:0;top:0;border:4px solid #ffd34a;box-shadow:0 0 0 3px rgba(58,29,14,.7),0 0 22px 6px rgba(255,211,74,.75);animation:tutPulse 1s ease-in-out infinite;}

// ===================== VIEW (auto-landscape) =====================
const VIEW = (() => {
  const v = { w: innerWidth, h: innerHeight, rot: false, u: 1, typing: false };
  const coarse = () => matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window);
  function update() {
    const sw = innerWidth, sh = innerHeight;
    v.rot = sh > sw && coarse() && !v.typing; // never rotate while typing, so the keyboard isn't sideways
    v.w = v.rot ? sh : sw; v.h = v.rot ? sw : sh;
    v.u = Math.max(0.8, Math.min(1.25, v.h / 600));
    const r = document.getElementById('root');
    if (r) {
      r.style.width = v.w + 'px'; r.style.height = v.h + 'px';
      r.style.transform = v.rot ? `translateX(${sw}px) rotate(90deg)` : 'none';
      r.classList.toggle('rot', v.rot); r.classList.toggle('small', v.h < 560); r.classList.toggle('tiny', v.h < 420);
      r.style.setProperty('--u', v.u); r.style.setProperty('--vh', v.h + 'px'); r.style.setProperty('--vw', v.w + 'px');
    }
  }
  // screen (client) coords -> local landscape coords
  v.toLocal = (x, y) => v.rot ? { x: y, y: innerWidth - x } : { x, y };
  v.update = update;
  // typing: show the page upright while a text box has focus
  const isText = el => el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') && !el.readOnly;
  document.addEventListener('focusin', e => { if (isText(e.target) && !v.typing) { v.typing = true; update(); window.dispatchEvent(new Event('viewchange')); } });
  document.addEventListener('focusout', e => { if (isText(e.target)) setTimeout(() => { if (!isText(document.activeElement) && v.typing) { v.typing = false; update(); window.dispatchEvent(new Event('viewchange')); } }, 60); });
  // real landscape: on phones, go fullscreen and lock the screen sideways (Android browsers). Installed apps use the manifest instead.
  v.lockLandscape = async () => {
    if (!coarse() || matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches) return;
    try { if (!document.fullscreenElement && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen({ navigationUI: 'hide' }); } catch (e) {}
    try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); } catch (e) {}
    setTimeout(() => { update(); window.dispatchEvent(new Event('viewchange')); }, 300);
  };
  window.addEventListener('resize', () => { update(); window.dispatchEvent(new Event('viewchange')); });
  window.addEventListener('orientationchange', () => setTimeout(() => { update(); window.dispatchEvent(new Event('viewchange')); }, 120));

  // drag-to-scroll for scroll areas while the UI is rotated (native touch scrolling would go the wrong way)
  let ds = null, suppress = false;
  document.addEventListener('pointerdown', e => {
    if (!v.rot) return; const el = e.target.closest && e.target.closest('.panel-body, .scrollx, .burst'); if (!el || e.target.closest('input,select')) return;
    ds = { el, x: e.clientX, y: e.clientY, st: el.scrollTop, sl: el.scrollLeft, moved: false };
  }, true);
  document.addEventListener('pointermove', e => {
    if (!ds) return; const dlx = e.clientY - ds.y, dly = -(e.clientX - ds.x);
    if (Math.abs(dlx) + Math.abs(dly) > 6) ds.moved = true;
    if (ds.moved) { ds.el.scrollTop = ds.st - dly; ds.el.scrollLeft = ds.sl - dlx; }
  }, true);
  document.addEventListener('pointerup', () => { if (ds && ds.moved) { suppress = true; setTimeout(() => suppress = false, 50); } ds = null; }, true);
  document.addEventListener('click', e => { if (suppress) { e.stopPropagation(); e.preventDefault(); suppress = false; } }, true);
  return v;
})();

// ===================== NETWORK (accounts, cloud save, friends) =====================
const NET = (() => {
  const TOKEN_KEY = 'mss_token';
  const online = /^https?:$/.test(location.protocol);
  let token = null; try { token = localStorage.getItem(TOKEN_KEY); } catch (e) {}
  let user = null, likes = {}, lastPush = 0, pushing = false, cloudDirty = false;

  async function api(method, path, body, opts = {}) {
    const res = await fetch(path, { method, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) }, body: body ? JSON.stringify(body) : undefined, keepalive: !!opts.keepalive });
    let data = {}; try { data = await res.json(); } catch (e) {}
    if (res.status === 401 && path !== '/api/login') { setToken(null); }
    if (!res.ok) throw Object.assign(new Error(data.error || `Server error (${res.status})`), { status: res.status });
    return data;
  }
  function setToken(t) { token = t; try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) {} }

  async function resume() { if (!online || !token) return null; try { const r = await api('GET', '/api/me'); user = r.user; likes = r.likes || {}; return r; } catch (e) { return e.status === 401 ? null : { offlineError: e }; } }
  async function login(username, password) { const r = await api('POST', '/api/login', { username, password }); setToken(r.token); user = r.user; likes = r.likes || {}; return r; }
  async function signup(username, password) { const r = await api('POST', '/api/signup', { username, password }); setToken(r.token); user = r.user; likes = {}; return r; }
  async function logout() { try { await pushNow(); await api('POST', '/api/logout'); } catch (e) {} setToken(null); user = null; }

  function markCloud() { cloudDirty = true; }
  async function pushNow() {
    if (!user || pushing) return; pushing = true;
    try { S.savedAt = Date.now(); await api('POST', '/api/save', { data: S }); cloudDirty = false; lastPush = Date.now(); }
    catch (e) { /* stays dirty, retried later */ }
    finally { pushing = false; }
  }
  function tick() { if (user && cloudDirty && Date.now() - lastPush > 12000) pushNow(); }
  function flush() { // page closing: keepalive request so progress isn't lost
    if (!user || !token) return; S.savedAt = Date.now();
    try { fetch('/api/save', { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify({ data: S }) }); } catch (e) {}
  }
  setInterval(tick, 3000);

  const friends = () => api('GET', '/api/friends').then(r => { likes = r.likes || likes; return r; });
  const adminUnlock = password => api('POST', '/api/admin/unlock', { password });
  const request = (query, invite) => api('POST', '/api/friends/request', { query, invite: !!invite });
  const respond = (id, accept) => api('POST', '/api/friends/respond', { id, accept });
  const cancel = id => api('POST', '/api/friends/cancel', { id });
  const remove = id => api('POST', '/api/friends/remove', { id });
  const visit = id => api('GET', '/api/visit?id=' + id);
  const like = (id, island) => api('POST', '/api/like', { id, island });
  const gift = (id, kind) => api('POST', '/api/gift', { id, kind });
  const claim = id => api('POST', '/api/gifts/claim', { id });

  return { online, get user() { return user; }, get likes() { return likes; }, get hasToken() { return !!token; },
    resume, login, signup, logout, markCloud, pushNow, flush, adminUnlock, friends, request, respond, cancel, remove, visit, like, gift, claim };
})();

    },
    { // 13 finish
      targets: [{ none: true, text: `You're all set! Here's <b>1,000 coins</b> and <b>15 gems</b> to get you going.<br><br>Tip: a <b>Gem Mine</b> (20 gems, in Structures) digs up a free gem every day.` }],
      btn: 'Finish', finish: true,
    },
  ];

  let el, bub, txt, btn, arrow, ring, raf = 0, lastStep = -1;
  function build() {
    el = document.createElement('div'); el.id = 'tut';
    el.innerHTML = `<div class="tut-ring"></div><div class="tut-arrow"><svg viewBox="0 0 40 52"><path d="M20 50 L4 26 H14 V2 H26 V26 H36 Z" fill="#ffd34a" stroke="#3a1d0e" stroke-width="3.5" stroke-linejoin="round"/></svg></div>
      <div class="tut-bub"><div class="tut-who"></div><div class="tut-txt"></div><div class="tut-btns"><button class="btn sm wood tut-skip">Skip tutorial</button><button class="btn sm green tut-next">Next</button></div></div>`;
    $('#root').appendChild(el);
    bub = el.querySelector('.tut-bub'); txt = el.querySelector('.tut-txt'); btn = el.querySelector('.tut-next'); arrow = el.querySelector('.tut-arrow'); ring = el.querySelector('.tut-ring');
    const who = el.querySelector('.tut-who'); who.appendChild(portrait(SHAPE.bobble, 54));
    btn.onclick = () => { Audio.sfx('tap'); const st = STEPS[S.tut - 1]; if (st && st.finish) finish(); else next(); };
    el.querySelector('.tut-skip').onclick = () => { if (!el.dataset.armed) { el.dataset.armed = 1; el.querySelector('.tut-skip').textContent = 'Sure? Tap again'; return; } skip(); };
  }
  function visible(n) { if (!n) return false; const r = n.getBoundingClientRect(); if (r.width < 2 || r.height < 2) return false; if (n.closest('.hidden')) return false; return getComputedStyle(n).visibility !== 'hidden'; }
  function localRect(n) {
    const r = n.getBoundingClientRect(), a = VIEW.toLocal(r.left, r.top), b = VIEW.toLocal(r.right, r.bottom);
    return { x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.abs(a.x - b.x), h: Math.abs(a.y - b.y) };
  }
  // is the element actually on top (not hidden under a window)? the tutorial overlay itself is click-through
  function onTop(n) { const r = n.getBoundingClientRect(), h = document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2); return !h || n === h || n.contains(h) || h.closest('#tut'); }
  function closeTarget() { const x = [...document.querySelectorAll('#modal-wrap .xbtn, #book .xbtn, #map .xbtn, #sheet .xbtn')].find(n => visible(n) && onTop(n)); return { t: { text: 'Close this window to continue.' }, rect: x ? localRect(x) : null, close: true }; }
  function resolve(st) {
    for (const t of st.targets) {
      if (t.when && !t.when()) continue;
      if (t.none) return { t, rect: null };
      if (t.sel) { const n = [...document.querySelectorAll(t.sel)].find(visible); if (n) { if (!onTop(n) && n.closest('.panel-body, .scrollx')) { try { n.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (e) {} } return onTop(n) ? { t, rect: localRect(n) } : closeTarget(); } continue; }
      if (t.world) {
        const o = t.world(); if (!o) continue;
        const blocked = !$('#modal-wrap').classList.contains('hidden') || !$('#book').classList.contains('hidden') || !$('#map').classList.contains('hidden');
        if (blocked) return closeTarget();
        const p = Render.toScreen(o.x, o.y), z = Render.cam.z, r = (o.kind ? STRUCTS[o.kind].r * 1.1 : 70) * z;
        const cy0 = p.y - r * 0.65, cl = VIEW.rot ? { x: innerWidth - cy0, y: p.x } : { x: p.x, y: cy0 }, hit = document.elementFromPoint(cl.x, cl.y);
        if (hit && hit.tagName !== 'CANVAS' && !hit.closest('#tut') && hit.closest('#sheet')) return closeTarget(); // a Shape's panel is covering it
        return { t, rect: { x: p.x - r, y: p.y - r * 1.6, w: r * 2, h: r * 1.9 }, world: true };
      }
    }
    const c = closeTarget(); if (c.rect) return c;
    return { t: st.targets[st.targets.length - 1], rect: null };
  }
  function loop() {
    raf = requestAnimationFrame(loop);
    if (!tutOn()) { el.classList.add('hidden'); return; }
    const st = STEPS[S.tut - 1]; if (!st) { finish(); return; }
    if (st.done && st.done()) { next(); return; }
    const popupOpen = !$('#popup').classList.contains('hidden');
    el.classList.toggle('hidden', popupOpen);
    const R = resolve(st), text = typeof R.t.text === 'function' ? R.t.text() : R.t.text;
    if (txt.dataset.k !== text) { txt.innerHTML = text; txt.dataset.k = text; }
    btn.style.display = st.btn ? '' : 'none'; if (st.btn) btn.textContent = st.btn;
    const VW = el.clientWidth, VH = el.clientHeight, u = VIEW.u, bw = bub.offsetWidth, bh = bub.offsetHeight;
    let bx, by;
    if (R.rect) {
      const { x, y, w, h } = R.rect, cx = x + w / 2, bounce = Math.sin(performance.now() / 160) * 7 * u;
      ring.style.display = ''; Object.assign(ring.style, { left: x - 6 + 'px', top: y - 6 + 'px', width: w + 12 + 'px', height: h + 12 + 'px', borderRadius: R.world ? '50%' : '16px' });
      arrow.style.display = '';
      const below = y < VH * 0.42; // target near the top: arrow sits under it pointing up
      arrow.style.transform = `translate(${cx - 20}px, ${below ? y + h + 4 + bounce : y - 56 + bounce}px) scale(${u}) rotate(${below ? 180 : 0}deg)`;
      bx = cx - bw / 2; by = below ? y + h + 66 * u : y - 66 * u - bh;
      if (by < 6 || by + bh > VH - 6) { by = Math.max(6, Math.min(VH - bh - 6, y + h / 2 - bh / 2)); bx = cx + w / 2 + 60 * u; if (bx + bw > VW - 6) bx = x - w / 2 - 60 * u - bw; }
    } else { ring.style.display = 'none'; arrow.style.display = 'none'; bx = VW / 2 - bw / 2; by = VH * 0.3 - bh / 2; }
    bx = Math.max(6, Math.min(VW - bw - 6, bx)); by = Math.max(6, Math.min(VH - bh - 6, by));
    bub.style.transform = `translate(${bx}px, ${by}px)`;
    if (S.tut !== lastStep) { lastStep = S.tut; bub.classList.remove('pop'); void bub.offsetWidth; bub.classList.add('pop'); }
  }
  function enter() { const st = STEPS[S.tut - 1]; if (st && st.enter) st.enter(); }
  function next() { S.tut++; markDirty(); Audio.sfx('open'); if (S.tut > STEPS.length) finish(); else enter(); }
  function finish() { if (S.tut === TUT_DONE) return; S.tut = TUT_DONE; addCoins(1000); S.shards += 15; Audio.sfx('levelup'); UI.toast('Tutorial complete! +1,000 coins, +15 gems', 'good'); UI.refreshHUD(); markDirty(); el.classList.add('hidden'); }
  function skip() { S.tut = TUT_DONE; markDirty(); el.classList.add('hidden'); UI.toast('Tutorial skipped'); }
  function start() { if (!el) build(); if (!S.tut) { S.tut = 1; S.tutF = {}; markDirty(); } enter(); if (!raf) loop(); }
  function ev(name) { if (!tutOn()) return; S.tutF = S.tutF || {}; S.tutF[name] = 1; }
  function restart() { S.tut = 0; start(); }
  return { start, ev, restart, steps: STEPS.length };
})();

// ===================== BOOT =====================
(function boot() {
  VIEW.update(); UI.initIcons();
  Render.init(document.getElementById('game'));

  // title screen dancers
  const tcv = document.getElementById('title-cv'), tc = tcv.getContext('2d');
  const dancers = ['bobble', 'tikki', 'blocco', 'twinkla', 'zephyx', 'solara', 'lulla', 'hexbloom', 'cubbit', 'prismo'];
  let titleOn = true;
  function titleFrame(tn) {
    if (!titleOn) return;
    const d = Math.min(2, devicePixelRatio || 1), W = VIEW.w, H = VIEW.h; if (tcv.width !== W * d) { tcv.width = W * d; tcv.height = H * d; tcv.style.width = W + 'px'; tcv.style.height = H + 'px'; }
    tc.setTransform(d, 0, 0, d, 0, 0); tc.clearRect(0, 0, W, H);
    const t = tn / 1000, beat = t * 104 / 60;
    tc.fillStyle = 'rgba(255,255,255,0.12)'; for (let i = 0; i < 14; i++) { tc.save(); tc.translate(W / 2, H * 0.42); tc.rotate(t * 0.1 + i * TAU / 14); tc.beginPath(); tc.moveTo(0, 0); tc.lineTo(-60, -Math.max(W, H)); tc.lineTo(60, -Math.max(W, H)); tc.fill(); tc.restore(); }
    tc.fillStyle = '#6fd04f'; tc.strokeStyle = OUTLINE; tc.lineWidth = 5; tc.beginPath(); tc.ellipse(W / 2, H + 40, W * 0.7, 150, 0, 0, TAU); tc.fill(); tc.stroke();
    const n = dancers.length, sc = Math.min(1.1, W / 900, H / 520);
    dancers.forEach((id, i) => {
      const x = W / 2 + (i - (n - 1) / 2) * Math.min(110, W / (n + 0.5)), y = H - 40 + Math.abs(i - (n - 1) / 2) * 6;
      const ph = (beat + i * 0.25) % 1; const hi = { env: Math.exp(-ph * 4), since: ph * 0.577, vel: 0.9, sustain: 0.6 + 0.4 * Math.sin(t * 2 + i) };
      tc.save(); tc.translate(x, y); tc.scale(sc, sc); drawShape(tc, SHAPE[id], { t, hi, beat, seed: i + 1, playing: true }); tc.restore();
    });
    requestAnimationFrame(titleFrame);
  }
  requestAnimationFrame(titleFrame);

  const titleEl = document.getElementById('title'), tapMsg = document.getElementById('tap-msg'), authEl = document.getElementById('auth');
  // installable app / Android APK: the service worker keeps the app in step with the website
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('/sw.js').catch(() => {});
  // friend invite links: ?friend=CODE is remembered until the player is logged in, then a friend request is sent
  try { const inv = new URLSearchParams(location.search).get('friend'); if (inv) { localStorage.setItem('mss_invite', inv.trim().slice(0, 24)); history.replaceState(null, '', location.pathname); } } catch (e) {}
  async function useInvite() {
    let code = null; try { code = localStorage.getItem('mss_invite'); } catch (e) {} if (!code || !NET.user) return;
    try { localStorage.removeItem('mss_invite'); } catch (e) {}
    try { const x = await NET.request(code, true); UI.toast(x.friended ? `You and ${x.friended} are now friends!` : `Friend request sent to ${x.sent}! They'll see it in their Friends tab.`, 'good'); }
    catch (e) { if (!/that's you/i.test(e.message || '')) UI.toast(e.message || 'Could not use the invite link', 'bad'); }
  }
  function startGame() {
    titleOn = false;
    Audio.init(); Audio.setMusicVol(S.settings.music); Audio.setSfxVol(S.settings.sfx);
    Audio.setIsland(ISLAND[S.current]); Render.buildTerrain(); Render.resetCam(); syncAudio(); Audio.start(); Audio.resume();
    titleEl.classList.add('hidden');
    document.querySelector('#hud').classList.remove('hidden');
    UI.refreshHUD(); Audio.sfx('open');
    setTimeout(useInvite, 1200);
    const away = now() - (S.savedAt || now());
    if (!S.seenIntro || tutOn()) {
      S.seenIntro = true; markDirty(); Tut.start();
    } else if (away > 60000) {
      const bank = isl().monsters.reduce((a, m) => a + monBank(m), 0);
      UI.toast(`Welcome back! Your Shapes earned ${fmt(bank)} coins while you were away.`, 'good');
    }
  }
  // pick the newest of: cloud save, this account's cached local save, or (first login only) progress made before accounts existed
  function enterCloud(r) {
    const cache = readLocal(SAVE_KEY + ':' + NET.user.username), cloud = r.save;
    let pick = cloud && cache ? ((cache.savedAt || 0) > (cloud.savedAt || 0) ? cache : cloud) : (cloud || cache);
    if (!pick) { const legacy = readLocal(SAVE_KEY); let claimed = false; try { claimed = localStorage.getItem('mss_legacy_claimed'); } catch (e) {}
      if (legacy && !claimed) { pick = legacy; try { localStorage.setItem('mss_legacy_claimed', NET.user.username); } catch (e) {} } }
    S = normalizeSave(pick) || defaultState();
    save(); markDirty(); NET.pushNow(); startGame();
  }
  let mode = 'login';
  function showAuth(msg) { tapMsg.classList.add('hidden'); authEl.classList.remove('hidden'); document.getElementById('au-err').textContent = msg || ''; setTimeout(() => document.getElementById('au-user').focus(), 50); }
  authEl.querySelectorAll('[data-am]').forEach(b => b.onclick = () => { mode = b.dataset.am; authEl.querySelectorAll('[data-am]').forEach(x => x.classList.toggle('on', x === b)); document.getElementById('au-go').textContent = mode === 'login' ? 'Log In' : 'Create Account'; document.getElementById('au-pass').autocomplete = mode === 'login' ? 'current-password' : 'new-password'; document.getElementById('au-err').textContent = ''; });
  authEl.addEventListener('submit', async () => {
    const u = document.getElementById('au-user').value.trim(), p = document.getElementById('au-pass').value;
    if (!u || !p) { document.getElementById('au-err').textContent = 'Enter a username and password'; return; }
    Audio.init(); authEl.classList.add('busy');
    try { const r = mode === 'login' ? await NET.login(u, p) : await NET.signup(u, p); enterCloud(r); }
    catch (e) { document.getElementById('au-err').textContent = e.message || 'Could not reach the server'; }
    finally { authEl.classList.remove('busy'); }
  });
  ['pointerdown', 'pointerup', 'keydown'].forEach(ev => authEl.addEventListener(ev, e => e.stopPropagation()));

  titleEl.addEventListener('pointerup', async e => {
    if (!titleOn || !authEl.classList.contains('hidden') || tapMsg.dataset.busy) return;
    VIEW.lockLandscape();
    Audio.init(); // unlock audio during the tap
    if (!NET.online) { load(); startGame(); return; } // opened as a local file: play offline
    if (NET.hasToken) {
      tapMsg.dataset.busy = 1; tapMsg.textContent = 'LOADING…';
      const r = await NET.resume(); delete tapMsg.dataset.busy;
      if (r && r.user) return enterCloud(r);
      tapMsg.textContent = 'TAP TO PLAY';
      return showAuth(r && r.offlineError ? 'Could not reach the server. Try again.' : '');
    }
    showAuth();
  });

  setInterval(() => { if (dirty && !titleOn) { S.savedAt = now(); save(); } }, 4000);
  const flush = () => { if (titleOn) return; S.savedAt = now(); save(); NET.flush(); };
  window.addEventListener('pagehide', flush); document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
})();

</script>
